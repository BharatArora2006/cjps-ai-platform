<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contractor Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            font-size: 14px;
        }

        .demo-box {
            margin-top: 20px;
            background: #f3f4f6;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            color: #374151;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            🚀
        </div>

        <div class="title">
            CJPS Contractor Portal
        </div>

        <div class="subtitle">
            Login to manage assigned legal jobs
        </div>
        {% if error %}

        <div
            style="
                color:red;
                margin-bottom:15px;
                font-weight:bold;
            "
        >
            {{ error }}
        </div>

        {% endif %}
        
        <form action="/login" method="post">

            <div class="input-group">
                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button class="login-btn" type="submit">
                Login
            </button>

            <div style="margin-top:20px;text-align:center;">
                <a
                    href="/admin-login"
                    style="
                        color:#2563eb;
                        font-weight:bold;
                        text-decoration:none;
                        font-size:14px;
                    "
                >
                    🔐 Admin Login
                </a>
            </div>
        </form>

        <div class="demo-box">
            <strong>Demo Credentials</strong>
            <br><br>
            Email: contractor@test.com
            <br>
            Password: test123
        </div>

        <div class="footer-text">
            AI Workflow Management Platform
        </div>

    </div>

</body>
</html>
