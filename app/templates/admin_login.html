<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(
                135deg,
                #111827,
                #2563eb
            );
        }

        .login-container {

            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .logo {

            text-align: center;

            font-size: 52px;

            margin-bottom: 15px;
        }

        .title {

            text-align: center;

            font-size: 30px;

            font-weight: bold;

            color: #111827;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;

            font-size: 15px;
        }

        .input-group {

            margin-bottom: 20px;
        }

        .input-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #374151;
        }

        .input-group input {

            width: 100%;

            padding: 14px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-size: 15px;

            transition: 0.2s;
        }

        .input-group input:focus {

            outline: none;

            border-color: #2563eb;

            box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
        }

        .login-btn {

            width: 100%;

            padding: 14px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {

            background: #1d4ed8;
        }

        .demo-box {

            margin-top: 22px;

            background: #f3f4f6;

            padding: 14px;

            border-radius: 10px;

            font-size: 14px;

            color: #374151;
        }

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #9ca3af;

            font-size: 13px;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            🔐
        </div>

        <div class="title">
            CJPS Admin Portal
        </div>

        <div class="subtitle">
            AI Legal Workflow Management System
        </div>

        <form
            action="/admin-login"
            method="post"
        >

            <div class="input-group">

                <label>
                    Admin Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button
                class="login-btn"
                type="submit"
            >
                Login
            </button>

        </form>

        <div class="demo-box">

            <strong>
                Demo Admin Credentials
            </strong>

            <br><br>

            Email:
            admin@test.com

            <br>

            Password:
            admin123

        </div>

        <div class="footer">

            Secure Admin Access

        </div>

    </div>

</body>

</html>
