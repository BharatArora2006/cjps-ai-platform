<!DOCTYPE html>
<html>
<head>
    <title>Upload Job</title>
    <style>
        body { font-family: Arial; padding: 30px; }
        h1 { margin-bottom: 20px; }
        textarea { width: 100%; height: 150px; margin-bottom: 15px; }
        input, button { margin-bottom: 15px; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>

<h1>📤 Upload New Job</h1>

<form action="/upload" method="post" enctype="multipart/form-data">
    
    <label>Email Content:</label><br>
    <textarea name="email_text" placeholder="Paste email content here..."></textarea><br>

    <label>Upload PDFs (Summons / Complaint):</label><br>
    <input type="file" name="files" multiple><br>

    <button type="submit">Process Job</button>

</form>

<br>
<a href="/dashboard">⬅ Back to Dashboard</a>

</body>
</html>
